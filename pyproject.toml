[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "trnaseq"
version = "1.0.1"
description = "tRNA-seq analysis toolkit: charge quantification, QC, and visualization"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "plotly",
    "matplotlib",
    "pydeseq2",
]

[tool.setuptools.packages.find]
include = ["trnaseq*"]
