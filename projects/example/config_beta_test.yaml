# Beta test config for run_preprocessing.py
# ==========================================
# This config tests the unified preprocessing script against the example data

# Sample and Index Information
# -----------------------------
sample_list: "/mnt/g/GitHub-russel-vincent25/tRNA-charge-seq/projects/example/sample_list.xlsx"
index_list: "/mnt/g/GitHub-russel-vincent25/tRNA-charge-seq/utils/index_list_updated.xlsx"

# Input Data
# ----------
seq_dir: "raw_fastq"  # Directory containing FASTQ.bz2 files (under {output_dir}/data/)

# tRNA Database
# -------------
tRNA_database:
  human: "/mnt/g/GitHub-russel-vincent25/tRNA-charge-seq/tRNA_database_masked/human/human-tRNAs.fa"
  mouse: "/mnt/g/GitHub-russel-vincent25/tRNA-charge-seq/tRNA_database/mouse/mm10-tRNAs.fa"

# Alignment Parameters
# --------------------
SWIPE_score_mat: "/mnt/g/GitHub-russel-vincent25/tRNA-charge-seq/utils/nuc_score-matrix_2.txt"
common_seqs: "/mnt/g/GitHub-russel-vincent25/tRNA-charge-seq/utils/common-seqs_1k.fasta.bz2"

# Read Length and Quality
# ------------------------
min_read_len: 39  # MIN_INSERT_LEN (10) + UMI_LEN (10) + BC_MAX_LEN (19)
min_score_align: 15  # Minimum SWIPE alignment score

# Alignment Scoring
# -----------------
gap_penalty: 6
extension_penalty: 3

# Downsampling (optional)
# -----------------------
# Use one of these options, or set both to null for no downsampling
downsample_percentile: 50  # Same as notebook - downsample to 50th percentile
downsample_absolute: null

# Processing Options
# ------------------
overwrite: true  # Overwrite existing output directories

# Stage 3: Charge Quantification
# --------------------------------
run_charge_quantification: true
charge_count: "count"        # Column for charge calculation ('count' or 'UMIcount')
charge_levels:               # Annotation levels to quantify
  - transcript
  - codon
  - aa
include_synthetic: false     # Exclude synthetic controls from charge output
include_mito: true           # Include mitochondrial tRNAs

# Stage 4: Parquet Storage
# -------------------------
run_parquet_storage: true
parquet_compression: "snappy"

# Stage 5: QC Dashboard
# ----------------------
run_qc_report: true           # Generate QC_summary.csv + QC_report.html
run_alignment_qc: false       # Run on-demand via AlignmentViewer standalone
qc_report_format: "html"     # 'html' for interactive reports, 'png' for coverage plots
qc_top_trnas: 5              # Number of top tRNAs per sample to generate reports for
